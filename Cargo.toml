[package]
name = "rxfetch"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
clap = { version = "4.5.57", features = ["wrap_help", "derive"] }
nix = { version = "0.31.1", features = ["fs"] }
owo-colors = { version = "4.2.3", features = ["alloc", "supports-color"] }
sysinfo = "0.38.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "0.38.43", features = ["system"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = ["Win32_System_SystemInformation"] }
