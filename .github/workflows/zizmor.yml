name: Zizmor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  zizmor:
    name: Security Scan for GitHub Actions
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
        with:
          persist-credentials: false
      
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v1
        with:
          # Use online mode for up-to-date checks
          online: true
