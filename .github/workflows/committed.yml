name: Committed

on:
  pull_request:
    branches: [ main, master ]

jobs:
  committed:
    name: Commit Message Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Check commit messages
        uses: crate-ci/committed@v1.0.20
        with:
          args: HEAD~..HEAD
