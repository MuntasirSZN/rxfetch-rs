name: Cargo Deny

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Run weekly to check for new advisories
    - cron: '0 0 * * 0'

jobs:
  cargo-deny:
    name: Cargo Deny Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # actions/checkout@v4
      
      - name: Cargo Deny
        uses: EmbarkStudios/cargo-deny-action@82eb9f621fbc699dd0918f3ea06864c14cc84246 # EmbarkStudios/cargo-deny-action@v2
